name: rworkflows
'on':
  push:
    branches:
    - master
    - main
    - devel
    - RELEASE_**
    # Documentation-only pushes (e.g. the batched NEWS updates) need no check.
    # Not used for pull requests: the required check would then never report,
    # and the pull request could not be merged.
    paths-ignore:
    - NEWS
    - '**.md'
    - .github/ISSUE_TEMPLATE/**
  pull_request:
    branches:
    - master
    - main
    - devel
    - RELEASE_**
# A newer push to the same pull request or branch cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  # Pull requests are checked on Linux only (the required check). Pushes,
  # e.g. merges to devel, are checked on Linux, macOS and Windows.
  matrix:
    runs-on: ubuntu-latest
    outputs:
      config: ${{ steps.set.outputs.config }}
    steps:
    - id: set
      run: |
        linux='{"os":"ubuntu-latest","bioc":"devel","r":"auto","cont":"ghcr.io/bioconductor/bioconductor_docker:devel","rspm":null}'
        mac='{"os":"macOS-latest","bioc":"devel","r":"auto","cont":null,"rspm":null}'
        win='{"os":"windows-latest","bioc":"devel","r":"auto","cont":null,"rspm":null}'
        if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
          echo "config=[$linux]" >> "$GITHUB_OUTPUT"
        else
          echo "config=[$linux,$mac,$win]" >> "$GITHUB_OUTPUT"
        fi
  rworkflows:
    needs: matrix
    permissions: write-all
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    container: ${{ matrix.config.cont }}
    strategy:
      fail-fast: ${{ false }}
      matrix:
        config: ${{ fromJSON(needs.matrix.outputs.config) }}
    steps:
    # Temporary: ggtree (Bioconductor devel) needs the CRAN packages
    # treelayout and tidytree (>= 0.4.9), which are newer than the CRAN
    # snapshot used in the Bioconductor devel container. Without them, ggtree
    # and miaViz cannot be installed and the examples that use miaViz fail.
    # Install them from CRAN before the dependencies are installed. Only the
    # container job has R available at this point. Remove once the snapshot
    # includes them. Same workaround as in microbiome/OMA#938.
    - name: Install treelayout and tidytree from CRAN (temporary)
      if: ${{ matrix.config.cont != null }}
      run: Rscript -e 'install.packages(c("treelayout", "tidytree"), repos = "https://cloud.r-project.org")'
    - uses: neurogenomics/rworkflows@master
      with:
        run_bioccheck: ${{ false }}
        run_rcmdcheck: ${{ true }}
        as_cran: ${{ true }}
        run_vignettes: ${{ true }}
        has_testthat: ${{ true }}
        # Test coverage once, on Linux
        run_covr: ${{ matrix.config.os == 'ubuntu-latest' }}
        run_pkgdown: ${{ github.event_name == 'push' }}
        has_runit: ${{ false }}
        has_latex: ${{ false }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run_docker: ${{ false }}
        DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
        runner_os: ${{ runner.os }}
        cache_version: cache-v2
        docker_registry: ghcr.io
